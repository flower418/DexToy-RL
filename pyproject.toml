[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dextoy-rl"
version = "0.1.0"
description = "Dexterous toy manipulation with diffusion-guided reinforcement learning"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dextoy*"]
